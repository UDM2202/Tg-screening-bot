# Screener rules. Tune these without touching code; restart the bot to apply.

discovery:
  poll_interval_seconds: 60
  # DexScreener "latest token profiles" (tokens whose team paid for a profile).
  dexscreener_profiles: true
  # DexScreener "latest boosts".
  dexscreener_boosts: true
  # Pump.fun tokens graduating to an AMM pool, streamed from PumpPortal (free websocket).
  pumpportal_migrations: true
  # New pools on Raydium, PumpSwap and Meteora via a Helius websocket.
  # Needs HELIUS_API_KEY in .env. Off by default: it streams every swap on those
  # DEXes to spot new pools, which can use 10+ GB of data a day.
  helius_new_pools: false
  helius_programs: [raydium_amm_v4, raydium_cpmm, pumpswap, meteora_dlmm]
  # Tokens are re-checked every cycle until they pass, get rejected or age out.
  max_watchlist: 3000

# Tier 2: cheap market pre-filter, DexScreener data only. Sized for ~$5 positions.
tier2:
  min_liquidity_usd: 8000
  min_market_cap_usd: 30000
  max_market_cap_usd: 1500000
  min_liquidity_to_mcap_pct: 5
  min_age_minutes: 15
  max_age_hours: 24
  min_volume_to_liquidity: 1.0
  # Stop watching coins that are still this thin after this long. Most new pools
  # never get going, and this keeps them from crowding out the watchlist.
  give_up_below_liquidity_usd: 2000
  give_up_after_minutes: 120
  # Skip coins trading this far below the highest market cap the bot has seen for
  # them. Stops alerts right after a dump, when the dump's volume makes a coin pass.
  max_drop_from_peak_pct: 50
  # Don't alert while the price has fallen this much in the last 5 minutes:
  # someone is dumping right now. The coin is re-checked next minute.
  max_drop_5m_pct: 20
  # Socials are a soft score by default. Set true to drop tokens with no links at all.
  require_any_social: false

# Tier 1: hard rug rejects. Rug risk doesn't shrink with position size, so don't loosen these.
tier1:
  require_mint_authority_revoked: true
  require_freeze_authority_revoked: true
  min_lp_locked_pct: 90
  max_top10_holders_pct: 20
  max_single_holder_pct: 10
  max_dev_holding_pct: 5
  reject_creator_rug_history: true
  # Reject when RugCheck reports any "danger" level risk, except those listed below.
  reject_rugcheck_danger_risks: true
  ignore_danger_risks: ["Low Liquidity"]
  # Token-2022 traps: transfer fees, transfer hooks, non-transferable, closable, mutable balances.
  reject_token2022_traps: true
  # Honeypot check: quote a buy then a sell of the received tokens on Jupiter.
  require_sell_route: true
  max_round_trip_loss_pct: 15
  sell_sim_sol_amount: 0.03
  sell_sim_slippage_bps: 1000
  # GoPlus is a second opinion on authorities, Token-2022 traps and malicious creators.
  use_goplus: true

socials:
  min_telegram_members: 100
  # Warn when the same website was already used by another token.
  warn_website_reuse: true

tracker:
  # Price is recorded this long after each decision (alert or reject).
  checkpoints:
    1h: 3600
    24h: 86400
    7d: 604800
  interval_seconds: 300
  # Also track rejected coins, so you can compare passing alerts against the rest.
  track_rejected: true
  weekly_summary: true

# Follow-up messages after an alert, sent as replies to it.
# watch_all_alerts: true sends milestones, dips, sell pressure and rug warnings for
# every alert (measured from the alert price). false limits those to coins you mark
# with /bought, and other alerts only get the rug warning.
watch:
  interval_seconds: 60
  watch_all_alerts: true
  alert_watch_hours: 24
  position_watch_hours: 72
  # Messages when price reaches these multiples of your entry.
  milestones: [2, 5, 10]
  # Warn when price falls this far from its highest point since you bought.
  dip_from_peak_pct: 30
  # Warn when sells outnumber buys this many times over in the last 5 minutes,
  # with at least sell_min_count sells and price down sell_price_drop_pct.
  sell_ratio: 3
  sell_min_count: 10
  sell_price_drop_pct: 10
  pressure_cooldown_minutes: 30
  # Warn when liquidity falls this far below its highest level (possible rug).
  liquidity_drop_pct: 50

apis:
  dexscreener: https://api.dexscreener.com
  rugcheck: https://api.rugcheck.xyz
  goplus: https://api.gopluslabs.io
  jupiter: https://lite-api.jup.ag
  pumpportal_ws: wss://pumpportal.fun/api/data
  helius_ws: wss://mainnet.helius-rpc.com
  helius_rpc: https://mainnet.helius-rpc.com

database: data/screener.db
